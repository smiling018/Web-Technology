<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 15px;
            border: 1px solid gray;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card h2 {
            color: brown;
            font-size: 24px;
            margin: 20px 0 10px;
        }

        .card p {
            color: gray;
            font-size: 16px;
            margin: 8px 0;
            line-height: 1.5;
        }

        button {
            background-color: brown;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="bread.jpg" alt="Baked Bread">
            <h2>Baked Bread</h2>
            <p>Fresh and tasty baked bread.</p>
            <p>Price: $20.99</p>
            <button>Buy now</button>
        </div>
        <div class="card">
            <img src="soup.jpg" alt="Fresh Soup">
            <h2>Fresh Soup</h2>
            <p>Healthy and delicious fresh soup.</p>
            <p>Price: $15.99</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
